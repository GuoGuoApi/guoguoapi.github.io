    <script>
        // 从Markdown文件加载所有动态
        async function loadAllUpdatesFromMarkdown() {
            // 获取DOM元素
            const container = document.getElementById('all-updates-container');
            const loadingIndicator = document.getElementById('loading-indicator');
            const noUpdates = document.getElementById('no-updates');
            
            try {
                // 读取更新日志MD文件，添加缓存控制确保获取最新内容
                const response = await fetch('assets/updates.md?' + new Date().getTime());
                if (!response.ok) {
                    throw new Error('Failed to load updates');
                }
                
                const markdownContent = await response.text();
                const updates = [];
                
                // 解析MD文件中的多个更新条目
                const sections = markdownContent.split('---');
                
                for (let i = 1; i < sections.length; i += 2) {
                    // 解析元数据
                    const metadataBlock = sections[i].trim();
                    const content = sections[i + 1] ? sections[i + 1].trim() : '';
                    
                    // 提取标题、日期、描述等元数据
                    const metadata = {};
                    metadataBlock.split('\n').forEach(line => {
                        if (line.includes(':')) {
                            const i = line.indexOf(':');
                            const key = line.substring(0, i).trim();
                            let value = line.substring(i + 1).trim();
                            if (value.startsWith('[') && value.endsWith(']')) {
                                value = value.substring(1, value.length - 1).split(',').map(v => v.trim().replace(/['"]/g, ''));
                            } else {
                                value = value.replace(/^["']|["']$/g, '');
                            }
                            metadata[key] = value;
                        }
                    });
                    
                    // 确保必要的字段存在
                    if (metadata.title && metadata.date) {
                        updates.push({
                            title: metadata.title,
                            date: metadata.date,
                            description: metadata.description || content.split('\n')[0],
                            content: content
                        });
                    }
                }
                
                // 按日期降序排序（最新的在前）
                updates.sort((a, b) => new Date(b.date) - new Date(a.date));
                
                // 隐藏加载指示器
                loadingIndicator.style.display = 'none';
                
                // 如果没有更新条目，显示默认内容
                if (updates.length === 0) {
                    noUpdates.style.display = 'block';
                    return;
                }
                
                // 清空容器并渲染所有更新条目
                container.innerHTML = '';
                
                updates.forEach(update => {
                    const updateItem = document.createElement('div');
                    updateItem.className = 'update-item';
                    updateItem.innerHTML = `
                        <div class="update-header">
                            <h3 class="update-title">${update.title}</h3>
                            <span class="update-date"><i class="fas fa-calendar-alt"></i> ${update.date}</span>
                        </div>
                        <p class="update-description">${update.description}</p>
                        ${Array.isArray(update.tags) && update.tags.length ? `<div style="margin-top:8px;">${update.tags.map(t => `<span class='tag'>${t}</span>`).join('')}</div>` : ''}
                    `;
                    container.appendChild(updateItem);
                });
                
                console.log('All updates loaded successfully:', updates);
                
            } catch (error) {
                console.error('Error loading updates:', error);
                // 加载失败时显示默认内容
                loadingIndicator.style.display = 'none';
                noUpdates.style.display = 'block';
            }
        }
        
        // 页面加载后执行
        document.addEventListener('DOMContentLoaded', function() {
            loadAllUpdatesFromMarkdown();
        });
    </script>
    
    <!-- 实时时间显示脚本 -->
    <script>
        // 实时更新时间
        function updateCurrentTime() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const weekDays = ['日', '一', '二', '三', '四', '五', '六'];
            const weekDay = weekDays[now.getDay()];
            
            const timeString = `${year}年${month}月${day}日 星期${weekDay} ${hours}:${minutes}:${seconds}`;
            document.getElementById('current-time').textContent = timeString;
        }
        
        // 页面加载时更新一次时间，然后每秒更新一次
        window.onload = function() {
            updateCurrentTime();
            setInterval(updateCurrentTime, 1000);
        };
    </script>
