<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网站访问验证</title>
    <link rel="stylesheet" href="css/style.css?v=20251119">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* 密码输入页面样式 */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .password-container {
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            width: 90%;
            text-align: center;
            position: relative;
            z-index: 1;
            background-color: transparent;
            backdrop-filter: blur(10px);
        }
        
        .password-container h1 {
            margin-bottom: 20px;
            color: #ffffff;
            font-size: 24px;
            font-weight: 600;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
        }
        
        .password-container p {
            margin-bottom: 30px;
            color: #f0f0f0;
            font-size: 16px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        }
        
        .password-input {
            width: 100%;
            padding: 15px;
            margin-bottom: 20px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 18px;
            box-sizing: border-box;
            transition: border-color 0.3s ease;
            background-color: var(--bg-secondary);
            color: var(--text-primary);
        }
        
        .password-input:focus {
            border-color: var(--primary);
            outline: none;
        }
        
        .error-message {
            color: #ef4444;
            margin-bottom: 20px;
            font-size: 14px;
            min-height: 20px;
            display: none;
        }
        
        .verify-button {
            width: 100%;
            padding: 15px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.1s ease;
        }
        
        .verify-button:hover {
            background-color: var(--secondary);
        }
        
        .verify-button:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav aria-label="主导航">
        <div class="nav-container">
            <a href="index.html" class="logo">个人网站</a>
            <ul class="nav-links" id="nav-links">
                <li><a href="index.html"><i class="fas fa-home"></i> 首页</a></li>
                <li><a href="about.html"><i class="fas fa-user"></i> 个人简历</a></li>
                <li><a href="blog.html"><i class="fas fa-book"></i> 学习记录</a></li>
                <li><a href="resources.html"><i class="fas fa-folder"></i> 资料展示</a></li>
            </ul>
            <div class="current-time" id="current-time"></div>
            <div class="hamburger" role="button" tabindex="0" aria-label="打开导航菜单" aria-controls="nav-links" aria-expanded="false">
                <i class="fas fa-bars"></i>
            </div>
        </div>
    </nav>

    <div class="password-container">
        <h1>网站访问验证</h1>
        <p>请输入访问密码以查看内容</p>
        <input type="password" class="password-input" placeholder="请输入密码" id="password">
        <div class="error-message" id="error">密码错误，请重试</div>
        <button class="verify-button" id="verify">验证密码</button>
    </div>

    <!-- 实时时间显示脚本 -->
    <script>
        // 实时更新时间
        function updateCurrentTime() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const weekDays = ['日', '一', '二', '三', '四', '五', '六'];
            const weekDay = weekDays[now.getDay()];
            
            const timeString = `${year}年${month}月${day}日 星期${weekDay} ${hours}:${minutes}:${seconds}`;
            const timeElement = document.getElementById('current-time');
            if (timeElement) {
                timeElement.textContent = timeString;
            }
        }
        
        // 页面加载时更新一次时间，然后每秒更新一次
        window.onload = function() {
            updateCurrentTime();
            setInterval(updateCurrentTime, 1000);
        };
    </script>

    <!-- 导航栏功能 -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const hamburger = document.querySelector('.hamburger');
            const navLinks = document.querySelector('.nav-links');

            // 点击页面其他区域关闭菜单的处理函数
            function handleClickOutsideMenu(e) {
                if (navLinks.classList.contains('active') && !hamburger.contains(e.target) && !navLinks.contains(e.target)) {
                    closeMobileMenu();
                }
            }

            function openMobileMenu() {
                navLinks.classList.add('active');
                document.body.classList.add('menu-open');
                document.addEventListener('keydown', handleMenuEscKey);
                // 添加点击外部区域关闭菜单的事件监听
                document.addEventListener('click', handleClickOutsideMenu);
                if (hamburger) hamburger.setAttribute('aria-expanded', 'true');
            }

            function closeMobileMenu() {
                navLinks.classList.remove('active');
                document.body.classList.remove('menu-open');
                document.removeEventListener('keydown', handleMenuEscKey);
                // 移除点击外部区域关闭菜单的事件监听
                document.removeEventListener('click', handleClickOutsideMenu);
                if (hamburger) hamburger.setAttribute('aria-expanded', 'false');
            }

            function handleMenuEscKey(e) {
                if (e.key === 'Escape') {
                    closeMobileMenu();
                }
            }

            if (hamburger && navLinks) {
                hamburger.addEventListener('click', function() {
                    if (navLinks.classList.contains('active')) {
                        closeMobileMenu();
                    } else {
                        openMobileMenu();
                    }
                });
                hamburger.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        if (navLinks.classList.contains('active')) {
                            closeMobileMenu();
                        } else {
                            openMobileMenu();
                        }
                    }
                });
            }
        });
    </script>

    <!-- 密码保护重定向脚本 -->
    <script src="js/password-redirect.js"></script>

    <!-- 密码验证功能 -->
    <script>
        // 密码配置
        // 防君子
        const CORRECT_PASSWORD = '******';
        // 获取URL参数，用于重定向回原来的页面
        function getParameterByName(name) {
            const url = window.location.href;
            name = name.replace(/[\[\]]/g, '\\$&');
            const regex = new RegExp('[?&]' + name + '(=([^&#]*)|&|#|$)');
            const results = regex.exec(url);
            if (!results) return null;
            if (!results[2]) return '';
            return decodeURIComponent(results[2].replace(/\+/g, ' '));
        }
        
        // 验证密码
        function verifyPassword() {
            const passwordInput = document.getElementById('password');
            const errorElement = document.getElementById('error');
            const enteredPassword = passwordInput.value;
            
            if (enteredPassword === CORRECT_PASSWORD) {
                // 密码正确，设置会话
                sessionStorage.setItem('site_access_granted', 'true');
                
                // 重定向到首页
                window.location.href = 'index.html';
            } else {
                // 密码错误，显示错误信息
                errorElement.style.display = 'block';
                passwordInput.value = '';
                passwordInput.focus();
            }
        }
        
        // 添加事件监听器
        document.getElementById('verify').addEventListener('click', verifyPassword);
        
        // 支持回车键提交
        document.getElementById('password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                verifyPassword();
            }
        });
    </script>
</body>
</html>
