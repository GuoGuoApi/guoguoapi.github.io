    <script>
        // 实际文章数据 - 将动态填充

        // 从文件系统动态加载博客文章列表
        function loadBlogPosts() {
            const blogList = document.getElementById('blog-list');
            
            // 显示加载状态
            blogList.innerHTML = '<div class="loading"><div class="spinner"></div> 正在加载文章列表...</div>';
            
            const blogPosts = [];
            // 动态构建适合GitHub Pages的路径
            let postsUrl;
            
            // 检查是否在GitHub Pages环境下
            if (window.location.hostname.endsWith('github.io')) {
                // 对于用户网站（如guoguoapi.github.io），直接使用根路径
                // 无论访问哪个页面，路径都应该是：/assets/posts.json
                postsUrl = '/assets/posts.json';
            } else {
                // 本地环境，直接使用相对路径
                postsUrl = 'assets/posts.json';
            }
            
            fetch(postsUrl)
                .then(r => { if (!r.ok) throw new Error('posts.json加载失败'); return r.json(); })
                .then(data => {
                    data.forEach((p, idx) => {
                        blogPosts.push({
                            id: idx + 1,
                            title: p.title,
                            date: p.date,
                            category: p.category || 'tech',
                            tags: Array.isArray(p.tags) ? p.tags : [],
                            summary: p.summary || '',
                            file: p.file
                        });
                    });
                })
                .catch(() => {
                    const articleFiles = [
                        "notes/2023-10-20-JavaScript基础学习笔记.md",
                        "notes/2025-10-21-Python基础学习笔记.md",
                        "notes/2025-01-07-GitHub静态网页部署教程.md"
                    ];
                    const parser = window.parseFrontMatter || parseFrontMatter;
                    
                    // 构建适合GitHub Pages的路径
                    const promises = articleFiles.map(file => {
                        let fullPath;
                        // 检查是否在GitHub Pages环境下
                        if (window.location.hostname.endsWith('github.io')) {
                            // 对于用户网站（如guoguoapi.github.io），直接使用根路径
                            // 无论访问哪个页面，路径都应该是：/filePath
                            fullPath = '/' + file;
                        } else {
                            // 本地环境，直接使用相对路径
                            fullPath = file;
                        }
                        
                        return fetch(fullPath)
                            .then(resp => { if (!resp.ok) throw new Error(file); return resp.text(); })
                            .then(content => {
                                const { meta } = parser(content);
                                const fileName = file.split('/').pop();
                                const dateMatch = fileName.match(/^(\d{4}-\d{2}-\d{2})/);
                                const dateFromFileName = dateMatch ? dateMatch[1] : '';
                                const titleFromFileName = fileName.replace(/^\d{4}-\d{2}-\d{2}-/, '').replace(/\.md$/, '');
                                blogPosts.push({
                                    id: blogPosts.length + 1,
                                    title: meta.title || titleFromFileName || '未命名文章',
                                    date: meta.date || dateFromFileName || '未知日期',
                                    category: meta.category || 'tech',
                                    tags: meta.tags || [],
                                    summary: meta.summary || '',
                                    file: file
                                });
                            })
                            .catch(() => {});
                    });
                    return Promise.all(promises);
                })
                .finally(() => {
                    blogPosts.sort((a, b) => new Date(b.date) - new Date(a.date));
                    blogList.innerHTML = '';
                    if (blogPosts.length === 0) {
                        blogList.innerHTML = '<div class="empty-state"><i class="fas fa-book-open"></i><p>暂无博客文章</p></div>';
                        return;
                    }
                    blogPosts.forEach(post => {
                        const card = document.createElement('div');
                        card.className = `card searchable category-${post.category}`;
                        card.innerHTML = `
                            <div class="card-content">
                                <h3 class="card-title">${post.title}</h3>
                                <p class="card-description">${post.summary}</p>
                                <div style="margin-top: 15px;">
                                    <span class="tag"><i class="fas fa-calendar-alt"></i> ${post.date}</span>
                                    <span class="tag ${post.category}">${getCategoryName(post.category)}</span>
                                    ${Array.isArray(post.tags) ? post.tags.map(tag => `<span class="tag">${tag}</span>`).join('') : ''}
                                </div>
                                <div style="margin-top: 15px;">
                                    <a href="blog-detail.html?file=${encodeURIComponent(post.file)}" class="card-link">阅读全文 <i class="fas fa-arrow-right"></i></a>
                                </div>
                            </div>`;
                        blogList.appendChild(card);
                    });
                    if (typeof reinitSearch === 'function') {
                        reinitSearch();
                    }
                });
        }

        // 根据分类筛选文章
        function filterByCategory(category) {
            const cards = document.querySelectorAll('.card');
            const tags = document.querySelectorAll('.tag');
            
            // 更新标签样式
            tags.forEach(tag => {
                tag.classList.remove('active');
                if ((category === 'all' && tag.textContent === '全部') || 
                    (category !== 'all' && tag.classList.contains(category))) {
                    tag.classList.add('active');
                }
            });
            
            // 筛选文章
            cards.forEach(card => {
                if (category === 'all' || card.classList.contains(`category-${category}`)) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        // 获取分类显示名称
        function getCategoryName(category) {
            const categories = {
                'tech': '技术',
                'life': '生活',
                'note': '笔记',
                'share': '分享'
            };
            return categories[category] || '其他';
        }
        
        // 解析YAML frontmatter
        function parseFrontMatter(content) {
            // 尝试提取YAML frontmatter
            const frontmatterRegex = /^---([\s\S]*?)---\s*/;
            const match = content.match(frontmatterRegex);
            
            const meta = {};
            let cleanContent = content;
            
            if (match && match[1]) {
                cleanContent = content.replace(frontmatterRegex, '');
                const frontmatter = match[1].trim();
                
                // 简单解析YAML格式
                const lines = frontmatter.split('\n');
                lines.forEach(line => {
                    // 忽略空行和注释
                    if (!line.trim() || line.trim().startsWith('#')) return;
                    
                    const colonIndex = line.indexOf(':');
                    if (colonIndex > 0) {
                        const key = line.substring(0, colonIndex).trim();
                        let value = line.substring(colonIndex + 1).trim();
                        
                        // 处理数组
                        if (value.startsWith('[') && value.endsWith(']')) {
                            // 简单数组解析
                            value = value
                                .substring(1, value.length - 1)
                                .split(',')
                                .map(item => item.trim().replace(/['"]/g, ''));
                        } else {
                            // 移除字符串引号
                            value = value.replace(/['"]/g, '');
                        }
                        
                        meta[key] = value;
                    }
                });
            }
            
            return { meta, content: cleanContent };
        }

        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', function() {
            loadBlogPosts();
        });
    </script>
    
    <!-- 实时时间显示脚本 -->
    <script>
        // 实时更新时间
        function updateCurrentTime() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const weekDays = ['日', '一', '二', '三', '四', '五', '六'];
            const weekDay = weekDays[now.getDay()];
            
            const timeString = `${year}年${month}月${day}日 星期${weekDay} ${hours}:${minutes}:${seconds}`;
            document.getElementById('current-time').textContent = timeString;
        }
        
        // 页面加载时更新一次时间，然后每秒更新一次
        window.onload = function() {
            updateCurrentTime();
            setInterval(updateCurrentTime, 1000);
        };
    </script>
